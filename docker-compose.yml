networks:
  loadtest_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
services:
  db:
    image: postgres:17
    container_name: postgres
    env_file:
      - .env.docker
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 5s
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    env_file:
      - .env.docker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx
    networks:
      loadtest_net:
        ipv4_address: 172.28.0.10
    ports:
      - "80:80"
      # ? wtf? what does nginx store?
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"

    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
      web-3:
        condition: service_healthy

  migrate:
    build: .
    image: ai-transaction-pipeline
    container_name: migration-container
    env_file:
      - .env.docker
    command: python manage.py migrate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-1:
    build: .
    image: ai-transaction-pipeline
    container_name: node-1
    env_file:
      - .env.docker
    networks:
      - default
      - loadtest_net
    command: gunicorn AI_transaction_processing_pipeline.wsgi:application --bind 0.0.0.0:8001 --workers 4
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/jobs/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-2:
    build: .
    image: ai-transaction-pipeline
    container_name: node-2
    env_file:
      - .env.docker
    networks:
      - default
      - loadtest_net
    command: gunicorn AI_transaction_processing_pipeline.wsgi:application --bind 0.0.0.0:8001 --workers 4
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/jobs/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-3:
    build: .
    image: ai-transaction-pipeline
    container_name: node-3
    env_file:
      - .env.docker
    networks:
      - default
      - loadtest_net
    command: gunicorn AI_transaction_processing_pipeline.wsgi:application --bind 0.0.0.0:8001 --workers 4
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/jobs/')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-1:
    build: .
    image: ai-transaction-pipeline
    container_name: celery-1
    env_file:
      - .env.docker
    command: celery -A AI_transaction_processing_pipeline worker -l info -c 4
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  k6-stress:
    image: grafana/k6
    container_name: stress-test-k6
    networks:
      loadtest_net: {}
    extra_hosts:
      - "nginx:172.28.0.10"
    profiles:
      - stresstest
    volumes:
      - ./tests:/scripts
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - /scripts/stress.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
      web-3:
        condition: service_healthy

  k6-load:
    image: grafana/k6
    container_name: load-test-k6
    networks:
      loadtest_net: {}
    profiles:
      - loadtest
    volumes:
      - ./tests:/scripts
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - /scripts/load.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
      web-3:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - default
      - loadtest_net
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data: